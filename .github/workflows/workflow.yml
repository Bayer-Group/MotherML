name: Workflow for model testing and release

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Setup uv environment 📚
        id: setup-uv-env
        uses: ./.github/actions/setup-uv-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-args: "--extra report --extra rna --extra tabpfn --extra tabicl"

      # - name: Run type checks #needs a lot of type fixing
      #   run: |
      #     uv run poe check-types
      - name: Run style checks
        run: |
          uv run poe check-style

      - name: Run linter
        run: |
          uv run poe check-lint
  test:
    needs: style
    runs-on: ubuntu-latest
    if:
      ${{ success() && (github.ref == 'refs/heads/main' || github.event_name ==
      'pull_request') }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      # When set to true, GitHub cancels all in-progress jobs if any matrix job fails.
      fail-fast: true
    name: Test 🧪 using 🐍
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7
        # needed for report dependencies
      - name: Prepare environment
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 libxrender1 libxtst6

      - name: Setup uv environment 📚
        id: setup-uv-env
        uses: ./.github/actions/setup-uv-env
        with:
          python-version: ${{ matrix.python-version }}
          install-args: "--extra rna --extra report --extra tabpfn --extra tabicl --extra clustering --group test_duration"

      - name: Cache HuggingFace and Torch models 🗂️
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/torch
          key: models-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            models-${{ runner.os }}-

      - name: Download TabPFN checkpoint
        run: |
          uv run python scripts/prepareTabpfn.py

      #----------------------------------------------
      #              run test suite
      #----------------------------------------------
      - name: Test and generate code coverage report
        run: |
          uv run poe coverage

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: ./coverage.xml

      - name: Test mother without extra dependencies
        run: |
          uv sync --no-dev
          uv run poe dist-test

  test-slow:
    needs: test
    runs-on: ubuntu-latest
    if:
      ${{ success() && (github.ref == 'refs/heads/main' || github.event_name ==
      'pull_request') }}
    name: Test Slow 🐢 using 🐍 3.14
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7
        # needed for report dependencies
      - name: Prepare environment
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 libxrender1 libxtst6

      - name: Setup uv environment 📚
        id: setup-uv-env
        uses: ./.github/actions/setup-uv-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-args: "--extra rna --extra report --extra tabpfn --extra tabicl --extra clustering --group test_duration"

      - name: Cache HuggingFace and Torch models 🗂️
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/torch
          key: models-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            models-${{ runner.os }}-

      - name: Download TabPFN checkpoint
        run: |
          uv run python scripts/prepareTabpfn.py

      #----------------------------------------------
      #              run slow test suite
      #----------------------------------------------
      - name: Run slow tests
        run: |
          uv run poe test-slow

  release-preflight:
    name: Release Preflight
    needs: test-slow
    runs-on: ubuntu-latest
    if:
      ${{ success() && (github.ref == 'refs/heads/main' || github.event_name ==
      'pull_request') }}
    # Least privilege: this job checks out and runs untrusted PR code
    # (scripts/release_preflight.py), so it must never hold a write-scoped token.
    # Posting the report comment is handled by the separate comment-preflight
    # job below, which never executes PR code.
    permissions:
      contents: read
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run release preflight report
        id: preflight
        run: |
          set +e
          python3 scripts/release_preflight.py --strict --output release-preflight-report.md
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload preflight artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-preflight-report
          path: release-preflight-report.md
          if-no-files-found: error

      - name: Fail on preflight violations
        if: steps.preflight.outputs.exit_code != '0'
        run: |
          echo "Release preflight failed with exit code ${{ steps.preflight.outputs.exit_code }}."
          exit 1

  comment-preflight:
    name: Comment Preflight Report
    needs: release-preflight
    runs-on: ubuntu-latest
    # Isolated commenting job: it does NOT check out or execute any PR code, it
    # only downloads the report artifact and posts it. This is the only job that
    # holds a write-scoped token, and it is gated to same-repo PRs (fork PRs
    # receive a read-only token from GitHub regardless). always() lets the
    # comment post even when the preflight check fails upstream.
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
    steps:
      - name: Download preflight artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: release-preflight-report

      - name: Comment preflight report on PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = 'release-preflight-report.md';
            const marker = '<!-- release-preflight-report -->';
            const report = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : 'Preflight report file was not generated.';
            const body = `${marker}\n## Release Preflight\n\n\
            _Automated check that complements semantic-release changelog generation._\n\n\
            \`\`\`markdown\n${report}\n\`\`\``;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  release:
    name: Create Release package
    needs: release-preflight
    if: success() && github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    concurrency: release
    environment: release
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false # Make sure to not use the GITHUB_TOKEN for checkout and thus enable updating the version with the PAT
      - name: Set python version 🐍
        run: echo "PYTHON_VERSION=3.11" >> $GITHUB_ENV

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-args: "--extra report --extra rna --extra tabpfn --extra tabicl"

      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@2896129e02bb7809d2cf0c1b8e9e795ee27acbcf # v10.2.0
        id: release
        with:
          github_token: ${{ secrets.PAT_RELEASE_PIPELINE }}

      #----------------------------------------------
      #              run publish
      #----------------------------------------------
      - name: Build package
        shell: bash
        run: |
          uv build

      - name: Check dist
        run: uv tool run twine check --strict dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Packages
          path: dist/
          if-no-files-found: error

  test-pypi-publish:
    name: Publish dev package to test.pypi.org
    runs-on: ubuntu-latest
    needs: release
    if: ${{ (github.repository == 'bayer-group/motherml' && github.event_name == 'push' && github.ref == 'refs/heads/main') }}

    environment:
      name: test-pypi
      url: https://test.pypi.org/p/mother-ml

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Packages
          path: dist

      - name: Upload package to Test PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          packages-dir: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: [release, test-pypi-publish]
    if: needs.release.outputs.released == 'true' && needs.test-pypi-publish.result == 'success'
    environment:
      name: pypi
      url: https://pypi.org/project/mother-ml/
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: Packages
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          packages-dir: dist/

  build-docs:
    name: Build Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 libxrender1 libxtst6

      - name: Setup uv environment 📚
        id: setup-uv-env
        uses: ./.github/actions/setup-uv-env
        with:
          python-version: "3.11"
          install-args: "--group docs"

      - name: Build docs
        run: uv run zensical build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy-docs:
    name: Publish Docs
    needs: build-docs
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
