name: Manual PyPI Publish

# Break-glass workflow to publish an already-built distribution to PyPI when the
# automated publish step was skipped or failed. It does NOT rebuild: it downloads
# the "Packages" artifact produced by a prior release run (already twine-checked)
# and uploads it through the same OIDC trusted-publishing path as the normal
# pipeline. Trigger from the Actions tab (Run workflow) with the release run's ID.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of the release CI run that produced the 'Packages' artifact"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-pypi:
    name: Publish to PyPI
    if: github.repository == 'Bayer-Group/MotherML'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/mother-ml/
    permissions:
      id-token: write # OIDC trusted publishing
      actions: read # read artifacts from another workflow run
    steps:
      - name: Validate source workflow run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            const run_id = Number(process.env.SOURCE_RUN_ID);
            if (!Number.isSafeInteger(run_id)) {
              throw new Error('run_id must be an integer');
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id,
            });
            if (
              run.path !== '.github/workflows/workflow.yml' ||
              run.event !== 'push' ||
              run.head_branch !== 'main' ||
              run.conclusion !== 'success'
            ) {
              throw new Error(`Run ${run_id} is not a successful main-branch CI run`);
            }

      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist/
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
