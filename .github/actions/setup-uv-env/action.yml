name: "Setup uv Environment"
description: "Creates a uv environment from the pyproject toml file"
inputs:
  python-version: # python version number
    description: "Python version to be used"
    required: true
    default: "3.11"
  install-args:
    description: "Additional args for uv sync"
    required: false
    default: ""
  uv-version:
    description: "uv version to use"
    required: false
    # Pin so a new uv release cannot change dependency resolution or build
    # behavior mid-week without a code change. Bump deliberately via PR.
    default: "0.12.21"
runs:
  using: "composite"
  steps:
    - id: setup-python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}
      #----------------------------------------------
      #  -----  install & configure uv  -----
      #----------------------------------------------
    - name: Install uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: true
        cache-dependency-glob: "**/uv.lock"

    #----------------------------------------------
    # install your root project, if required
    #----------------------------------------------
    - id: install-dependencies
      run: |
         uv sync --python ${{ inputs.python-version }} ${{ inputs.install-args }}
      shell: bash
